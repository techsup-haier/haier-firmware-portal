<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haier Brasil — Firmware Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Haier Brand Colors — Brand Book 2026 */
      --haier-blue: #005AAA;
      --haier-blue-hover: #004A8F;
      --innovation-blue: #0055FF;
      --intelligence-blue: #00D2FF;

      /* Neutrals (Beige) */
      --beige-1: #FFFAF2;
      --beige-2: #FAF1E1;
      --beige-3: #EADFCC;
      --beige-4: #D1C5B0;

      /* Neutrals (Gray) */
      --gray-1: #FAFAFA;
      --gray-2: #EDEDED;
      --gray-3: #C1C1C1;
      --gray-4: #6F6F6F;

      /* Functional */
      --white: #FFFFFF;
      --black: #000000;
      --bg: var(--beige-1);
      --surface: var(--white);
      --text-primary: var(--black);
      --text-secondary: var(--gray-4);
      --text-tertiary: var(--gray-3);
      --border: var(--gray-2);
      --border-light: #F0F1F3;

      /* Shadows */
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);

      /* Radius */
      --radius: 8px;
      --radius-sm: 6px;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    .header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-logo img {
      height: 28px;
      display: block;
    }

    .header-divider {
      width: 1px;
      height: 22px;
      background: var(--gray-2);
    }

    .header-subtitle {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.2px;
    }

    .header-badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--haier-blue);
      background: rgba(0, 90, 170, 0.06);
      padding: 5px 12px;
      border-radius: 4px;
      border: 1px solid rgba(0, 90, 170, 0.12);
    }

    /* ── HERO / SEARCH ── */
    .hero {
      padding: 56px 24px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Subtle H watermark — Brand Auxiliary Graphic */
    .hero::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 308px;
      opacity: 0.025;
      background:
        linear-gradient(var(--haier-blue), var(--haier-blue)) 0 0 / 40% 100% no-repeat,
        linear-gradient(var(--haier-blue), var(--haier-blue)) 60% 0 / 40% 100% no-repeat;
      mask:
        linear-gradient(#000, #000) 0 0 / 40% 42% no-repeat,
        linear-gradient(#000, #000) 0 58% / 40% 42% no-repeat,
        linear-gradient(#000, #000) 60% 0 / 40% 42% no-repeat,
        linear-gradient(#000, #000) 60% 58% / 40% 42% no-repeat;
      -webkit-mask:
        linear-gradient(#000, #000) 0 0 / 40% 42% no-repeat,
        linear-gradient(#000, #000) 0 58% / 40% 42% no-repeat,
        linear-gradient(#000, #000) 60% 0 / 40% 42% no-repeat,
        linear-gradient(#000, #000) 60% 58% / 40% 42% no-repeat;
      pointer-events: none;
      z-index: 0;
    }

    .hero > * { position: relative; z-index: 1; }

    .hero h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .hero p {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    .search-wrapper {
      max-width: 540px;
      margin: 0 auto;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-3);
      pointer-events: none;
      transition: color 0.2s;
    }

    .search-input {
      width: 100%;
      padding: 15px 20px 15px 50px;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 500;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow-sm);
      letter-spacing: 0.3px;
    }

    .search-input::placeholder {
      color: var(--gray-3);
      font-weight: 400;
    }

    .search-input:focus {
      border-color: var(--haier-blue);
      box-shadow: var(--shadow-md), 0 0 0 3px rgba(0, 90, 170, 0.08);
    }

    .search-input:focus ~ .search-icon {
      color: var(--haier-blue);
    }

    .search-hint {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 400;
      color: var(--gray-3);
    }

    .search-hint kbd {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 600;
      background: var(--beige-2);
      border: 1px solid var(--beige-3);
      padding: 2px 7px;
      border-radius: 4px;
      color: var(--text-secondary);
    }

    /* ── RESULTS ── */
    .results-area {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 24px 60px;
      width: 100%;
    }

    .results-count {
      font-size: 11px;
      font-weight: 700;
      color: var(--gray-3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
      padding-left: 2px;
    }

    .firmware-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .firmware-card:hover {
      border-color: var(--beige-3);
      box-shadow: var(--shadow-md);
    }

    .card-info {
      flex: 1;
      min-width: 0;
    }

    .card-model {
      font-family: 'Montserrat', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .card-description {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .card-meta {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .meta-item {
      font-size: 11px;
      font-weight: 500;
      color: var(--gray-3);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .meta-item svg { flex-shrink: 0; }

    .card-download { flex-shrink: 0; }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      background: var(--haier-blue);
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.2px;
    }

    .btn-download:hover { background: var(--haier-blue-hover); }
    .btn-download:active { transform: scale(0.97); }

    /* ── STATES ── */
    .state-message {
      text-align: center;
      padding: 44px 24px;
    }

    .state-message .state-icon { font-size: 36px; margin-bottom: 10px; }

    .state-message h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .state-message p {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
    }

    .state-loading .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--haier-blue);
      border-radius: 50%;
      margin: 0 3px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .state-loading .dot:nth-child(2) { animation-delay: 0.15s; }
    .state-loading .dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ── FOOTER ── */
    .footer {
      margin-top: auto;
      text-align: center;
      padding: 18px 24px;
      font-size: 11px;
      font-weight: 400;
      color: var(--gray-3);
      border-top: 1px solid var(--border);
      background: var(--white);
    }

    .footer-brand {
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ── HIGHLIGHT ── */
    mark {
      background: rgba(0, 90, 170, 0.08);
      color: var(--haier-blue);
      padding: 1px 2px;
      border-radius: 3px;
      font-weight: inherit;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .hero { padding: 36px 16px 24px; }
      .hero h1 { font-size: 21px; }
      .search-input { font-size: 14px; padding: 13px 16px 13px 44px; }
      .results-area { padding: 0 16px 40px; }
      .firmware-card {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 16px 16px;
      }
      .btn-download {
        width: 100%;
        justify-content: center;
        padding: 12px;
      }
      .header { padding: 12px 16px; }
      .header-logo img { height: 24px; }
      .header-badge { display: none; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-logo">
      <img src="Logo_Haier_Padrao.png" alt="Haier">
    </div>
    <div class="header-divider"></div>
    <span class="header-subtitle">Firmware Center</span>
    <span class="header-badge">Uso Interno</span>
  </header>

  <!-- HERO + SEARCH -->
  <section class="hero">
    <h1>Busca de Firmware</h1>
    <p>Digite o modelo da TV para encontrar a atualização disponível.</p>
    <div class="search-wrapper">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Ex: H50K6UG, LE42K6000..."
        autocomplete="off"
        autofocus
      >
      <p class="search-hint">
        <kbd>11</kbd> modelos disponíveis
      </p>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="results-area" id="resultsArea"></section>

  <!-- FOOTER -->
  <footer class="footer">
    <span class="footer-brand">Haier Brasil</span> · Assistência Técnica · Atualizado em <span id="lastUpdate"></span>
  </footer>

  <script>
    const CATALOG_URL = 'firmware-catalog.json';
    let catalog = [];

    const icons = {
      download: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
      file: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>',
      calendar: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
      size: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>'
    };

    async function loadCatalog() {
      showLoading();
      try {
        const res = await fetch(CATALOG_URL);
        if (!res.ok) throw new Error('Erro ao carregar catálogo');
        catalog = await res.json();
        document.querySelector('.search-hint kbd').textContent = catalog.length;
        const dates = catalog.map(f => f.date).sort().reverse();
        if (dates.length) document.getElementById('lastUpdate').textContent = formatDate(dates[0]);
        showInitial();
      } catch (err) {
        showError('Não foi possível carregar o catálogo de firmware.');
        console.error(err);
      }
    }

    function doSearch(query) {
      const q = query.trim().toUpperCase();
      if (!q) { showInitial(); return; }
      const results = catalog.filter(fw => fw.model.toUpperCase().includes(q));
      results.length === 0 ? showNotFound(query) : showResults(results, q);
    }

    function showLoading() {
      document.getElementById('resultsArea').innerHTML = `
        <div class="state-message state-loading">
          <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <p style="margin-top:12px">Carregando catálogo…</p>
        </div>`;
    }

    function showInitial() { showResults(catalog, ''); }

    function showNotFound(query) {
      document.getElementById('resultsArea').innerHTML = `
        <div class="state-message">
          <div class="state-icon">🔍</div>
          <h3>Nenhum resultado para "${escapeHtml(query)}"</h3>
          <p>Verifique o modelo digitado ou tente uma busca parcial.</p>
        </div>`;
    }

    function showError(msg) {
      document.getElementById('resultsArea').innerHTML = `
        <div class="state-message">
          <div class="state-icon">⚠️</div>
          <h3>Erro</h3>
          <p>${escapeHtml(msg)}</p>
        </div>`;
    }

    function showResults(items, query) {
      const countLabel = items.length === catalog.length
        ? `Todos os modelos (${items.length})`
        : `${items.length} resultado${items.length !== 1 ? 's' : ''}`;

      const cards = items.map(fw => `
        <div class="firmware-card">
          <div class="card-info">
            <div class="card-model">${highlightMatch(fw.model, query)}</div>
            <div class="card-description">${escapeHtml(fw.description)}</div>
            <div class="card-meta">
              <span class="meta-item">${icons.file} ${escapeHtml(fw.file)}</span>
              <span class="meta-item">${icons.size} ${escapeHtml(fw.size)}</span>
              <span class="meta-item">${icons.calendar} ${formatDate(fw.date)}</span>
            </div>
          </div>
          <div class="card-download">
            <a class="btn-download" href="${escapeHtml(fw.url)}" download>
              ${icons.download} Baixar
            </a>
          </div>
        </div>`).join('');

      document.getElementById('resultsArea').innerHTML = `
        <div class="results-count">${countLabel}</div>${cards}`;
    }

    function highlightMatch(text, query) {
      if (!query) return escapeHtml(text);
      const idx = text.toUpperCase().indexOf(query);
      if (idx === -1) return escapeHtml(text);
      return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>' + escapeHtml(text.slice(idx + query.length));
    }

    function formatDate(d) { const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; }

    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

    document.getElementById('searchInput').addEventListener('input', debounce(e => doSearch(e.target.value), 150));
    loadCatalog();
  </script>
</body>
</html>
